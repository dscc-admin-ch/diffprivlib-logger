[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "diffprivlib-logger"
version = "0.0.4a1"
description="A logger wrapper for DiffPrivLib"
readme = "README.md"
requires-python = ">=3.10, <4"
authors = [
    { name = "Data Science Competence Center", email = "dscc@bfs.admin.ch" },
    { name = "Swiss Federal Statistical Office" },
]
license = "MIT"
keywords = [
    "diffprivlib",
    "logger",
    "serialiser",
    "deserialiser",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
  "diffprivlib>=0.6.0",
  "scikit-learn>=0.24",
]

[project.urls]
Homepage = "https://github.com/dscc-admin/lomas/"

[project.optional-dependencies]
test = [
  "pytest>=8.3",
]
